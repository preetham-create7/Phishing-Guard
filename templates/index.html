<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhishGuard</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🛡️ PhishGuard</h1>

        <p>Smart Phishing URL Detection System</p>

        <div class="scanner">

            <h2>Check Your URL</h2>

            <input
                type="text"
                id="urlInput"
                placeholder="Enter website URL..."
            >

            <button id="scanButton" onclick="scanURL()">
                Scan URL
            </button>

            <div id="result"></div>

        </div>

        <p>Stay Safe. Think Before You Click.</p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
